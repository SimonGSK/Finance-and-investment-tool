<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Siden findes ikke · Økonomis</title>
    <!--
        GitHub Pages viser denne side for alle adresser, der ikke findes - også dybt inde i en sti,
        hvor relative links ikke virker. Derfor har siden sin egen stil her og ingen andre filer.
    -->
    <script>try{ document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')); }catch(e){}</script>
    <style>
        :root{ --bg:#0B0B0C; --panel:#151517; --border:#27272B; --text:#EDEDEE; --muted:#A3A3AB; --akt:#1F9D6F; --on-akt:#0B0B0C; }
        :root[data-theme="light"]{ --bg:#F3F1EB; --panel:#FCFBF8; --border:#E4E0D5; --text:#14231C; --muted:#4B5A52; --akt:#0B6B4F; --on-akt:#FFFFFF; }
        html, body{ margin:0; min-height:100%; background:var(--bg); color:var(--text); }
        body{ display:grid; place-items:center; min-height:100vh; padding:24px; box-sizing:border-box; font-family:'Manrope', system-ui, sans-serif; }
        main{ max-width:460px; text-align:center; padding:40px 28px; background:var(--panel); border:1px solid var(--border); border-radius:22px; }
        .name{ margin:0 0 20px; font-family:'Newsreader', Georgia, serif; font-size:24px; font-weight:600; color:var(--akt); }
        h1{ margin:0 0 12px; font-family:'Newsreader', Georgia, serif; font-size:34px; font-weight:600; letter-spacing:-0.02em; line-height:1.15; }
        p{ margin:0 0 24px; color:var(--muted); font-size:16px; line-height:1.6; }
        a.btn{ display:inline-block; padding:12px 24px; border-radius:999px; background:var(--akt); color:var(--on-akt); font-weight:600; text-decoration:none; }
        a.btn:focus-visible{ outline:2px solid var(--akt); outline-offset:3px; }
    </style>
</head>
<body>
    <main>
        <p class="name">Økonomis</p>
        <h1>Siden findes ikke</h1>
        <p>Adressen er måske skrevet forkert, eller siden er flyttet. Dine tal er ikke berørt – de ligger stadig på din enhed.</p>
        <a class="btn" id="homeLink" href="/Finance-and-investment-tool/">Gå til Økonomis</a>
    </main>
    <script>
        // På GitHub Pages ligger siden under /Finance-and-investment-tool/; lokalt (npm start) i roden.
        if(!location.hostname.endsWith('github.io')) document.getElementById('homeLink').href = '/';
    </script>
</body>
</html>
